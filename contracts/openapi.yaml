          title: Handles Task Kinds
        is_plugin:
          type: boolean
          title: Is Plugin
          default: false
        is_available:
          type: boolean
          title: Is Available
          default: true
        unavailable_reason:
          type: string
          title: Unavailable Reason
          description: Why the agent cannot run — e.g. its plugin is not installed.
          default: ''
      type: object
      required:
      - id
      - kind
      - display_name
      title: AgentDefinitionRead
