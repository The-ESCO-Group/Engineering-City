components:
  schemas:
    AddProjectMemberRequest:
      properties:
        user_id:
          type: string
          format: uuid
          title: User Id
        role:
          $ref: '#/components/schemas/ProjectRole'
          default: engineer
      type: object
      required:
      - user_id
      title: AddProjectMemberRequest
    AgentActionRead:
      properties:
        action_type:
          type: string
          title: Action Type
        summary:
          type: string
          title: Summary
        target_type:
          type: string
          title: Target Type
          default: ''
        target_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Target Id
        evidence_anchor_ids:
          items:
            type: string
            format: uuid
          type: array
          title: Evidence Anchor Ids
        confidence:
          type: number
          title: Confidence
          default: 0.0
        requires_approval:
          type: boolean
          title: Requires Approval
          default: false
        warnings:
          items:
            type: string
          type: array
          title: Warnings
        accepted:
          type: boolean
          title: Accepted
          default: true
        rejection_reason:
          type: string
          title: Rejection Reason
          default: ''
      type: object
      required:
      - action_type
      - summary
      title: AgentActionRead
      description: 'A model-proposed action, as recorded on the run.


        ``accepted`` is false for actions the backend refused; ``rejection_reason``

        says why. Refusals are kept rather than discarded — they are part of the

        record of what the model tried to do.'
    AgentDefinitionRead:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        kind:
          type: string
          title: Kind
        display_name:
          type: string
          title: Display Name
        description:
          type: string
          title: Description
          default: ''
        building:
