  /api/approvals/{approval_id}/decision:
    post:
      tags:
      - approvals
      summary: Record an engineering decision
      description: "Approve or reject.\n\nThree things this enforces, none of which can be left to convention:\n\
        \n* only a human decides — the caller is an authenticated user, and no agent\n  action can reach\
        \ this endpoint;\n* the decider needs the reviewer role *and* a reviewing role on the project,\n\
        \  so an engineer cannot sign off their own project's safety findings;\n* ``approved`` has no\
        \ default. Approving is always an explicit act, never the\n  result of an omitted field.\n\nOnce\
        \ every approval on a project is decided, the tasks waiting on the gate\nreturn to the queue and\
        \ the run continues."
