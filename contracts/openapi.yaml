  /api/projects/{project_id}/events:
    get:
      tags:
      - events
      summary: Replay a project's event history
      description: 'Events in sequence order.


        Pass the last `seq` you saw as `since_seq` to fetch only what followed. This

        is the same ordering the WebSocket delivers, so the two are interchangeable

        for catching up.'
      operationId: list_events_api_projects__project_id__events_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: since_seq
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          title: Since Seq
      - name: event_type
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/EventType'
          - type: 'null'
          title: Event Type
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 200
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventEnvelope'
                title: Response List Events Api Projects  Project Id  Events Get
        '422':
