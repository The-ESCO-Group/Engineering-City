openapi: 3.1.0
info:
  title: ESCO Engineering City
  description: "\nLocal-first, evidence-based engineering review platform for ESCO Group.\n\nThe platform\
    \ analyses uploaded engineering documents (Studio 5000 L5X exports,\ninterlock schedules, I/O lists,\
    \ functional descriptions) and produces findings\nthat always cite exact evidence.\n\n**Boundaries\
    \ this API enforces by design**\n\n* It never connects to an industrial controller and never uploads,\
    \ downloads or\n  modifies controller programs.\n* It does not parse proprietary `.ACD` files and\
    \ does not claim to.\n* It never applies a PLC or electrical design change; recommendations are\n\
    \  proposals for a human engineer.\n* Safety- and equipment-damage-related recommendations cannot\
    \ be released\n  without a recorded human approval.\n* Model output is never presented as approved\
    \ engineering, and raw model\n  reasoning is never stored or returned.\n"
  version: 0.1.0
  x-contract-version: 1.0.0
  license:
    name: ESCO Group internal
paths:
  /api/health:
    get:
      tags:
      - system
      summary: Liveness, contract version and installed capabilities
      description: 'Report whether the backend is usable, and precisely what it can do.


        Returns ``degraded`` rather than failing when the database is unreachable,

        so an operator can still read the diagnosis from a running process.'
      operationId: health_api_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /api/system/capabilities:
    get:
      tags:
      - system
      summary: Optional plugin capabilities and why any are unavailable
      operationId: capabilities_api_system_capabilities_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/CapabilityStatus'
                type: array
                title: Response Capabilities Api System Capabilities Get
  /api/auth/login:
    post:
      tags:
      - authentication
      summary: Exchange credentials for an access token
      description: 'Authenticate locally.


        Both success and failure are audited. Every failure returns the same message

        regardless of cause, so the response cannot be used to enumerate accounts.'
      operationId: login_api_auth_login_post
      parameters:
      - name: User-Agent
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User-Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/logout:
    post:
      tags:
      - authentication
      summary: Revoke the current access token
      description: 'Deny-list the presented token and clear the cookie.


        The token is genuinely invalidated server-side; this is not a client-side

        gesture that leaves a stolen token usable until it expires.'
      operationId: logout_api_auth_logout_post
      parameters:
      - name: User-Agent
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User-Agent
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/auth/me:
    get:
      tags:
      - authentication
      summary: The authenticated user and their project roles
      operationId: me_api_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserResponse'
  /api/auth/users:
    post:
      tags:
      - authentication
      summary: Create a user (administrator only)
      operationId: create_user_api_auth_users_post
      parameters:
      - name: User-Agent
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User-Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - authentication
      summary: List users (administrator only)
      operationId: list_users_api_auth_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserSummary'
                title: Response List Users Api Auth Users Get
  /api/projects:
    post:
      tags:
      - projects
      summary: Create a project
      operationId: create_project_api_projects_post
      parameters:
      - name: User-Agent
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User-Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - projects
      summary: List projects the caller can see
      operationId: list_projects_api_projects_get
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/ProjectStatus'
          - type: 'null'
          title: Status
      - name: include_archived
        in: query
        required: false
        schema:
          type: boolean
          default: true
          title: Include Archived
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page_ProjectRead_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}:
    get:
      tags:
      - projects
      summary: Project detail with membership and roll-up counts
      operationId: get_project_api_projects__project_id__get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - projects
      summary: Update project metadata
      description: 'Update editable metadata.


        ``status`` is deliberately not accepted here — it belongs to the workflow

        engine. Use the workflow endpoints to change what a project is doing.'
      operationId: update_project_api_projects__project_id__patch
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}/archive:
    post:
      tags:
      - projects
      summary: Archive a project (read-only from then on)
      operationId: archive_project_api_projects__project_id__archive_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}/members:
    get:
      tags:
      - projects
      summary: List project members
      operationId: list_members_api_projects__project_id__members_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMemberRead'
                title: Response List Members Api Projects  Project Id  Members Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - projects
      summary: Add a member or change their project role
      operationId: add_member_api_projects__project_id__members_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddProjectMemberRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectMemberRead'
                title: Response Add Member Api Projects  Project Id  Members Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}/files:
    post:
      tags:
      - files
      summary: Upload one or more files
      description: 'Validate and store uploaded files.


        Each file is accepted or rejected independently: one refused file does not

        discard the rest, and every rejection comes back with a reason the uploader

        can act on. A ZIP is expanded safely and each usable member is recorded as a

        file in its own right.'
      operationId: upload_files_api_projects__project_id__files_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: User-Agent
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User-Agent
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_files_api_projects__project_id__files_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - files
      summary: List a project's files
      operationId: list_files_api_projects__project_id__files_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: include_deleted
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Include Deleted
      - name: file_kind
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/FileKind'
          - type: 'null'
          title: File Kind
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UploadedFileRead'
                title: Response List Files Api Projects  Project Id  Files Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/files/{file_id}:
    get:
      tags:
      - files
      summary: File metadata, parse artifacts and anchor count
      operationId: get_file_api_files__file_id__get
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: File Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - files
      summary: Delete a file and remove its stored bytes
      description: 'Delete a file.


        The bytes are removed but the row is retained, so evidence anchors that

        cited it resolve to a tombstone rather than silently disappearing.'
      operationId: delete_file_api_files__file_id__delete
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: File Id
      - name: User-Agent
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: User-Agent
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/files/{file_id}/content:
    get:
      tags:
      - files
      summary: Download the stored original bytes
      description: 'Stream a stored original.


        ``Content-Disposition: attachment`` plus the ``nosniff`` header applied to

        every response means an uploaded document is never rendered as active

        content by a browser.'
      operationId: download_file_api_files__file_id__content_get
      parameters:
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: File Id
      responses:
        '200':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}/runs:
    post:
      tags:
      - workflow
      summary: Start a review run
      description: 'Create the task graph for a new run.


        Returns `409` if a run is already in progress: two concurrent runs over one

        project would interleave findings and neither would be reproducible.'
      operationId: start_run_api_projects__project_id__runs_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartRunRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunRead'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}/pause:
    post:
      tags:
      - workflow
      summary: Pause the run
      description: 'Stop the worker taking further tasks.


        A task already running is allowed to finish; interrupting it mid-write would

        leave partial state for the recovery path to untangle.'
      operationId: pause_run_api_projects__project_id__pause_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowControlRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}/resume:
    post:
      tags:
      - workflow
      summary: Resume a paused run
      operationId: resume_run_api_projects__project_id__resume_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowControlRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}/cancel:
    post:
      tags:
      - workflow
      summary: Cancel the run
      description: 'Cancel every unfinished task.


        Completed work is kept: cancelling a run is not the same as retracting what

        it already found.'
      operationId: cancel_run_api_projects__project_id__cancel_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowControlRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}/workflow:
    get:
      tags:
      - workflow
      summary: Current workflow state and task counts
      operationId: workflow_state_api_projects__project_id__workflow_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}/tasks:
    get:
      tags:
      - workflow
      summary: List a project's tasks
      operationId: list_tasks_api_projects__project_id__tasks_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/TaskStatus'
          - type: 'null'
          title: Status
      - name: run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRead'
                title: Response List Tasks Api Projects  Project Id  Tasks Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/tasks/{task_id}:
    get:
      tags:
      - workflow
      summary: Task detail with its dependency edges
      operationId: get_task_api_tasks__task_id__get
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}/recover:
    post:
      tags:
      - workflow
      summary: Requeue tasks abandoned by a stopped worker
      description: 'Manually trigger the lease sweep.


        The worker does this automatically at startup and periodically; this exists

        for an operator who has just restarted after a crash and does not want to

        wait out the sweep interval.'
      operationId: recover_tasks_api_projects__project_id__recover_post
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}/parsers:
    get:
      tags:
      - workflow
      summary: Which file kinds this installation can parse
      description: 'Per-kind parser availability.


        A kind reported unavailable here explains why a file of that kind will not be

        analysed, rather than leaving it looking merely unexamined.'
      operationId: parser_capabilities_api_projects__project_id__parsers_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
                title: Response Parser Capabilities Api Projects  Project Id  Parsers Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/agents:
    get:
      tags:
      - agents
      summary: Every registered agent, and why any is unavailable
      description: 'The agent catalogue.


        Includes agents contributed by plugins, and reports one as unavailable with a

        reason rather than omitting it — a missing agent that simply is not listed

        looks identical to one that never existed.'
      operationId: list_agents_api_agents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AgentDefinitionRead'
                type: array
                title: Response List Agents Api Agents Get
  /api/projects/{project_id}/agents:
    get:
      tags:
      - agents
      summary: Agent presence for the city view
      operationId: list_project_agents_api_projects__project_id__agents_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentInstanceRead'
                title: Response List Project Agents Api Projects  Project Id  Agents Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/projects/{project_id}/agent-runs:
    get:
      tags:
      - agents
      summary: Agent runs for a project
      operationId: list_runs_api_projects__project_id__agent_runs_get
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Project Id
      - name: agent_kind
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Agent Kind
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentRunRead'
                title: Response List Runs Api Projects  Project Id  Agent Runs Get
        '422':
          description: Validation Error
