[project]
name = "esco-engineering-city-backend"
version = "0.1.0"
description = "Local-first, evidence-based engineering review platform for ESCO Group."
requires-python = ">=3.12"
license = { text = "Proprietary - ESCO Group internal" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "SQLAlchemy>=2.0.36",
    "alembic>=1.14",
    "python-multipart>=0.0.12",
    "PyJWT>=2.9",
    "argon2-cffi>=23.1",
    "defusedxml>=0.7.1",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.2",
    "pypdf>=5.1",
    "charset-normalizer>=3.4",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML",
    "types-jsonschema",
    "freezegun>=1.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "backend" }

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error::DeprecationWarning:app.*",
]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: marks tests that take noticeably longer to run",
    "contract: marks tests that validate the published API/event contracts",
]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]
extend-exclude = [".venv", "data", "frontend", "desktop"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
    "ASYNC",
    "T20",  # no print
]
ignore = [
    "S101",  # assert is fine (pytest + internal invariants)
    "B008",  # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S105", "S106", "S311", "T20"]
"backend/app/database/migrations/**" = ["I001", "E402"]
"scripts/**" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
mypy_path = "backend"
packages = ["app"]
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_return_any = false
show_error_codes = true
plugins = ["pydantic.mypy"]
exclude = ["^backend/app/database/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["docx.*", "pypdf.*", "openpyxl.*", "defusedxml.*", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.database.migrations.*"]
ignore_errors = true
