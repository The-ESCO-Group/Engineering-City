# CompactLogix machine-control project layout.
# See templates/README.md for the file format and the versioning rule.
id: esco.controller.compactlogix.machine
version: 2.0.0
category: controller_project
display_name: CompactLogix machine-control project layout
description: >
  Task, program and routine skeleton for a single-machine CompactLogix
  application. One continuous MainTask carries five programs —
  Safety_Device_Status, Machine_Control, Alarms, HMI_Interface and Diagnostics —
  and each program's MainRoutine calls that program's routines with JSR, so
  execution order is written down in ladder rather than left to the order
  routines happen to sit in the tree.
supported_families: [compactlogix]
approval_level: standard
restricted_domains: []

parameters:
  - name: controller_name
    type: identifier
    required: true
    description: Controller name as it will appear in the project, e.g. LINE4_CTRL
  - name: machine_name
    type: string
    required: true
    description: Machine or line this controller runs; used in program descriptions

required_tags:
  - role: status
    suffix: Sys_FirstScan
    data_type: BOOL
    description: One-shot first-scan flag, set from the controller status bit
  - role: mode
    suffix: Machine_Mode_Auto
    data_type: BOOL
    description: Machine is in automatic mode
  - role: alarm
    suffix: Alarm_Any_Active
    data_type: BOOL
    description: Any alarm is currently active; drives the stack light and HMI banner
  - role: diagnostic
    suffix: Sys_ScanTime_ms
    data_type: DINT
    description: Last MainTask scan time in milliseconds
  - role: diagnostic
    suffix: Sys_Controller_Faulted
    data_type: BOOL
    description: A controller minor or major fault is present
  - role: hmi_interface
    suffix: HMI_Heartbeat
    data_type: DINT
    description: Counter the HMI watches to prove the controller is still scanning

generated_objects:
  tasks:
    - name: MainTask
      type: continuous
      description: >
        The single continuous task; everything in this layout runs in it. The
        watchdog is a fixed 500 ms in this layout and is not a parameter; see
        the restrictions.
      watchdog_ms: 500
      programs:
        - Safety_Device_Status
        - Machine_Control
        - Alarms
        - HMI_Interface
        - Diagnostics

  programs:
    - name: Safety_Device_Status
      type: normal
      description: >
        Reads the STATUS of safety devices — E-stop relay contacts, guard
        switches, light-curtain outputs — and publishes it for the interlock
        gate to consume. It executes first so that everything downstream sees a
        settled picture. It is NOT safety logic and it stops nothing by itself;
        see restrictions. The program was called Safety_Monitor until 2.0.0,
        which read as a promise this program cannot keep.
      main_routine: MainRoutine
      routines: [R_EStop_Status, R_Guard_Status]

    - name: Machine_Control
      type: normal
      description: >
        Permissives and interlocks, modes, the machine sequence, and the device
        control blocks, in that order.
      main_routine: MainRoutine
      routines: [R_Permissives, R_Interlocks, R_Mode_Select, R_Sequence, R_Devices]

    - name: Alarms
      type: normal
      description: Alarm detection and latching, kept out of the control programs
      main_routine: MainRoutine
      routines: [R_Alarm_Detect, R_Alarm_Latch]

    - name: HMI_Interface
      type: normal
      description: >
        The only place HMI-written tags are read into machine logic and machine
        state is published back out, so the HMI is one boundary rather than a
        set of writes scattered through the application.
      main_routine: MainRoutine
      routines: [R_HMI_Inputs, R_HMI_Outputs]

    - name: Diagnostics
      type: normal
      description: Scan time, controller fault status and communication health
      main_routine: MainRoutine
      routines: [R_Scan_Diagnostics, R_Comms_Diagnostics]

  routines:
    # -- Safety_Device_Status ----------------------------------------------
    - name: MainRoutine
      program: Safety_Device_Status
      language: ladder
      description: Calls the safety-device status routines in order
      is_main: true
    - name: R_EStop_Status
      program: Safety_Device_Status
      language: ladder
      description: >
        E-stop relay contact status, published for use as a machine INTERLOCK
        source (_Ilk_Sources_OK). Never as a permissive: a permissive gates
        starting and does not stop equipment that is already running.
    - name: R_Guard_Status
      program: Safety_Device_Status
      language: ladder
      description: >
        Guard-switch and light-curtain status, published for use as a machine
        INTERLOCK source (_Ilk_Sources_OK), on the same terms as the E-stop
        status and for the same reason: an open guard has to stop a conveyor
        that is running, and a permissive cannot do that.

    # -- Machine_Control ---------------------------------------------------
    - name: MainRoutine
      program: Machine_Control
      language: ladder
      description: >
        Calls permissives and interlocks, then mode selection, then the
        sequence, then the device blocks
      is_main: true
    - name: R_Permissives
      program: Machine_Control
      language: ladder
      description: Conditions that must be true before equipment may be started
    - name: R_Interlocks
      program: Machine_Control
      language: ladder
      description: >
        Conditions that stop running equipment, and the first-out capture. This
        is where the safety-device status read by the program above is consumed.
    - name: R_Mode_Select
      program: Machine_Control
      language: ladder
      description: Manual/automatic selection and the transition rules between them
    - name: R_Sequence
      program: Machine_Control
      language: ladder
      description: The machine step sequence
    - name: R_Devices
      program: Machine_Control
      language: ladder
      description: One control block per device, expanded from the equipment patterns

    # -- Alarms ------------------------------------------------------------
    - name: MainRoutine
      program: Alarms
      language: ladder
      description: Calls alarm detection then alarm latching
      is_main: true
    - name: R_Alarm_Detect
      program: Alarms
      language: ladder
      description: Evaluates each alarm condition
    - name: R_Alarm_Latch
      program: Alarms
      language: ladder
      description: Latches alarms and handles acknowledgement and reset

    # -- HMI_Interface -----------------------------------------------------
    - name: MainRoutine
      program: HMI_Interface
      language: ladder
      description: Calls the HMI input routine, then the HMI output routine
      is_main: true
    - name: R_HMI_Inputs
      program: HMI_Interface
      language: ladder
      description: Moves HMI-written command tags into machine logic
    - name: R_HMI_Outputs
      program: HMI_Interface
      language: ladder
      description: Publishes machine state, alarm state and the heartbeat to the HMI

    # -- Diagnostics -------------------------------------------------------
    - name: MainRoutine
      program: Diagnostics
      language: ladder
      description: Calls the scan-time and communication diagnostic routines
      is_main: true
    - name: R_Scan_Diagnostics
      program: Diagnostics
      language: ladder
      description: Scan time and controller fault status
    - name: R_Comms_Diagnostics
      program: Diagnostics
      language: ladder
      description: Connection status for every remote node

  rungs:
    - routine: Safety_Device_Status/MainRoutine
      title: Call E-stop status
      comment: >
        Safety-device status is read before anything else in the scan so that
        machine logic downstream sees one settled picture per scan.
      elements:
        - {instruction: JSR, operand: R_EStop_Status, kind: output}
    - routine: Safety_Device_Status/MainRoutine
      title: Call guard status
      comment: Guard and light-curtain status, on the same terms as the E-stop status.
      elements:
        - {instruction: JSR, operand: R_Guard_Status, kind: output}

    - routine: Machine_Control/MainRoutine
      title: Call permissive evaluation
      comment: >
        Permissives and interlocks are evaluated before the sequence and the
        device blocks, so a trip takes effect on the scan it is detected rather
        than the next one.
      elements:
        - {instruction: JSR, operand: R_Permissives, kind: output}
    - routine: Machine_Control/MainRoutine
      title: Call interlock evaluation
      comment: >
        Where the E-stop and guard status read by Safety_Device_Status is
        consumed. An interlock stops running equipment; that is what makes this
        routine, and not the permissive routine above, the right home for it.
      elements:
        - {instruction: JSR, operand: R_Interlocks, kind: output}
    - routine: Machine_Control/MainRoutine
      title: Call mode selection
      comment: >
        Mode is resolved before the sequence runs, so a mode change takes effect
        on the same scan the sequence evaluates rather than one scan later.
      elements:
        - {instruction: JSR, operand: R_Mode_Select, kind: output}
    - routine: Machine_Control/MainRoutine
      title: Call the machine sequence
      comment: The step sequence, which sets the device commands the next routine acts on.
      elements:
        - {instruction: JSR, operand: R_Sequence, kind: output}
    - routine: Machine_Control/MainRoutine
      title: Call the device control blocks
      comment: >
        Device blocks run last in this program so that they act on commands the
        sequence set this scan.
      elements:
        - {instruction: JSR, operand: R_Devices, kind: output}

    - routine: Alarms/MainRoutine
      title: Call alarm detection
      comment: Evaluate every alarm condition against the state this scan produced.
      elements:
        - {instruction: JSR, operand: R_Alarm_Detect, kind: output}
    - routine: Alarms/MainRoutine
      title: Call alarm latching
      comment: >
        Latching runs after detection so that an alarm that appeared and cleared
        within one scan is still latched and visible to an operator.
      elements:
        - {instruction: JSR, operand: R_Alarm_Latch, kind: output}

    - routine: HMI_Interface/MainRoutine
      title: Call HMI inputs
      comment: HMI-written tags are read in here and nowhere else.
      elements:
        - {instruction: JSR, operand: R_HMI_Inputs, kind: output}
    - routine: HMI_Interface/MainRoutine
      title: Call HMI outputs
      comment: Machine state is published to the HMI here and nowhere else.
      elements:
        - {instruction: JSR, operand: R_HMI_Outputs, kind: output}

    - routine: Diagnostics/MainRoutine
      title: Call scan diagnostics
      comment: Scan time and controller fault status.
      elements:
        - {instruction: JSR, operand: R_Scan_Diagnostics, kind: output}
    - routine: Diagnostics/MainRoutine
      title: Call communication diagnostics
      comment: Connection status for every remote node.
      elements:
        - {instruction: JSR, operand: R_Comms_Diagnostics, kind: output}

engineering_notes: >
  Version 2.0.0 renamed a program and corrected what two routine descriptions
  told every project to do with their contents. Until 2.0.0 the E-stop and guard
  status routines were described as being "for use as a machine permissive". In
  this template set a permissive has a precise meaning — it appears in the START
  branch only, and esco.motor.standard says in as many words that losing it does
  not stop a running motor — so the layout was directing every project to put
  guard and E-stop status into the one classification guaranteed not to stop
  machinery. An operator opening a guard door on a running conveyor would have
  found the conveyor still running. Both descriptions now say INTERLOCK, the
  routines that build the interlock gate exist in this layout, and the program
  is called Safety_Device_Status rather than Safety_Monitor, because a program
  named for monitoring safety invites exactly the reliance its restriction
  disclaims.

  Also in 2.0.0, main_task_watchdog_ms was removed. It was a declared parameter
  that could not reach the task specification — the watchdog is a literal in
  this layout — so an engineer could state 250 ms, have it accepted and recorded
  against the requirement, and get a controller with 500 ms.

  JSR calls a routine inside the same program. There is no cross-program JSR in
  Logix, so "one MainRoutine that calls everything" is not expressible: each
  program has its own MainRoutine, the task calls those, and program order in
  the task is what sequences the five programs. That order is deliberate —
  safety-device status, then control, then alarms, then the HMI boundary, then
  diagnostics — so that each stage reads state the previous stage settled in the
  same scan.

  A continuous task is the right default for one machine: it uses whatever time
  is left after periodic tasks, and machine logic has no fixed period to hold.
  Move to a periodic task only when something downstream genuinely needs a
  deterministic interval, and record the reason.

  The HMI_Interface program exists so that every tag an operator can write is
  read in one routine. Scattering HMI writes through the control logic is what
  makes "what can change this bit" unanswerable a year later.

restrictions:
  - >
    Safety_Device_Status is a STANDARD program that reads the status of safety
    devices. It is not safety logic, it is not safety-rated, it stops nothing by
    itself, and it must never be used to implement a safety function. E-stop,
    guard interlocking and light-curtain muting belong in a safety controller
    with safety-rated instructions, assessed against the machine's risk
    assessment by a qualified person. What this program produces is a standard
    status bit, and what a standard status bit is worth is a question for that
    assessment.
  - >
    A condition that must STOP running equipment is never a permissive in this
    template set. A permissive appears in the start branch of the device
    patterns and nothing else, so equipment already sealed in keeps running when
    it goes false — by design, and stated as such in esco.motor.standard. E-stop
    relay status, guard status and light-curtain status therefore belong in
    _Ilk_Sources_OK, which drops the seal. Putting one of them in
    _Perm_Sources_OK produces a conveyor that keeps running with the guard open,
    and no validator in this platform can tell that the wrong classification was
    chosen.
  - >
    This template creates an empty skeleton. Every routine it creates contains
    no logic other than the JSR calls listed above; the machine sequence, the
    permissives and interlocks, the alarms and the device blocks are still to be
    written.
  - >
    Does not create tasks other than MainTask, and does not size the watchdog
    for you. The MainTask watchdog is a fixed 500 ms in this layout: there is no
    parameter for it, because a parameter this template cannot apply is worse
    than none — it records a number nobody's controller will run. Change it in
    the generated project, or add a layout that states a different one.
  - Does not create I/O modules, a controller path, or any communication configuration.
  - Does not apply to GuardLogix or Compact GuardLogix; the safety task and safety programs are out of scope.
  - Does not decide program execution order for you beyond the order listed here; changing it changes behaviour.

tests:
  - name: Every program has a called MainRoutine
    given: The layout has been expanded into an empty project
    when: The project is examined
    then: >
      Each of the five programs has a MainRoutine marked as the program's main
      routine, and the task lists all five programs.
  - name: No routine is dead on arrival
    given: The layout has been expanded
    when: A cross-reference pass runs
    then: >
      Every routine this template creates is either a program main routine or
      the target of a JSR in that program's MainRoutine.
  - name: Program order is as specified
    given: The layout has been expanded
    when: MainTask's program list is read
    then: >
      The order is Safety_Device_Status, Machine_Control, Alarms, HMI_Interface,
      Diagnostics.
  - name: The interlock routine exists for the safety-device status to feed
    given: The layout has been expanded
    when: Machine_Control is examined
    then: >
      R_Permissives and R_Interlocks both exist and are called from
      Machine_Control's MainRoutine before R_Sequence and R_Devices, so
      esco.permissive.interlock has somewhere to expand into.
  - name: No routine description offers safety-device status as a permissive
    given: The expanded layout
    when: The routine descriptions are read
    then: >
      R_EStop_Status and R_Guard_Status both say their status is consumed as an
      interlock, and neither offers it as a permissive.
  - name: The skeleton imports
    given: The generated L5X artifacts
    when: They are imported into Studio 5000 in the stated order
    then: The import completes with no error and the controller verifies clean.
