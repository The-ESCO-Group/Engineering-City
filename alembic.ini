; Alembic configuration for the ESCO Engineering City backend.
;
; The database URL is NOT set here. It is read from ESCO_DATABASE_URL (via
; app.core.config) inside migrations/env.py, so migrations always run against
; the same database the application uses and no connection string is committed.
;
;   alembic upgrade head
;   alembic revision --autogenerate -m "describe the change"
;   alembic downgrade -1

[alembic]
script_location = backend/app/database/migrations
prepend_sys_path = backend
path_separator = os

; Timestamped, ordered filenames so the history reads chronologically.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

; No post-write hooks: the formatter is invoked from the repo's own check
; commands (`ruff format backend`), which keeps this file independent of how the
; virtualenv exposes its entry points.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
