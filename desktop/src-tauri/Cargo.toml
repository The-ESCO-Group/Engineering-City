[package]
name = "esco-engineering-city"
version = "0.1.0"
edition = "2021"
description = "Local-only Windows shell for ESCO Engineering City"
license = "Proprietary"
[lib]
name = "esco_engineering_city_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
url = "2"
